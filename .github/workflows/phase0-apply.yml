  test('same media placed twice on one track receives distinct CLIP ids', () {
    final MediaPlacementResult first = placeMediaInEdit(
      source: '[EDIT:main]\n[/EDIT]\n',
      media: _unityMedia,
      editId: 'main',
      trackId: 'V1',
