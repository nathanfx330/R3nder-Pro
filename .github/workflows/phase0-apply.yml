name: Phase 0 minimal implementation

on:
  push:
    branches:
      - phase0-media-placement-minimal-build

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true

      - name: Apply Phase 0 source changes
        run: |
          python3 tool/phase0_apply.py
          python3 tool/phase0_test_adjust.py

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Run core Phase 0 tests
        run: |
          flutter test \
            test/edit_media_import_test.dart \
            test/edit_clip_creation_test.dart \
            test/edit_media_placement_test.dart \
            test/edit_surface_model_test.dart

      - name: Run Add Video append regression
        run: >-
          flutter test test/edit_workspace_test.dart
          --plain-name "ADD VIDEO appends when playhead is inside existing V1 clip"

      - name: Confirm retired writer has no references
        run: |
          if grep -R -n --exclude-dir=.git 'createEditWithClip' lib test; then
            echo 'createEditWithClip still has references'
            exit 1
          fi

      - name: Commit implementation and remove temporary harness
        run: |
          git rm -f \
            .github/workflows/phase0-audit.yml \
            .github/workflows/phase0-apply.yml \
            tool/phase0_apply.py \
            tool/phase0_test_adjust.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test docs
          git commit -m 'Unify EDIT media placement and make Add Video append'
          git push origin HEAD:phase0-media-placement-minimal-build
