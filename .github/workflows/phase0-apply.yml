          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:80]!r}')
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f'{path}: missing start marker {start!r}')
              b = text.find(end, a)
              if b < 0:
                  raise SystemExit(f'{path}: missing end marker {end!r}')
              write(path, text[:a] + replacement + text[b:])

