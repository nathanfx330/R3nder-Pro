name: Editorial Sidecard Review
# Temporary branch-only validation; remove after review.

on:
  push:
    branches:
      - editorial-sidecard-redesign
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Targeted tests
        run: >-
          flutter test
          test/presentation_card_face_parity_test.dart
          test/presentation_panel_content_test.dart
          test/presentation_panel_painter_test.dart
          test/edit_card_cue_controls_test.dart
          test/edit_sidecard_cue_controls_test.dart
          test/edit_card_cue_inspector_integration_test.dart
          test/sidecard_overlay_test.dart
