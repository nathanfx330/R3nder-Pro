name: Phase 0 audit

on:
  push:
    branches:
      - phase0-media-placement

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Phase 0 call sites
        run: |
          echo '=== createEditWithClip ==='
          grep -R -n --exclude-dir=.git 'createEditWithClip' lib test docs || true
          echo '=== ImportedEditVideo constructors ==='
          grep -R -n --exclude-dir=.git 'ImportedEditVideo(' lib test || true
          echo '=== ExactClipSpeed unity allocations ==='
          grep -R -n --exclude-dir=.git 'ExactClipSpeed(1)' lib test || true
          echo '=== edit workspace Add Video tests ==='
          grep -n -A40 -B5 "ADD VIDEO" test/edit_workspace_test.dart || true
