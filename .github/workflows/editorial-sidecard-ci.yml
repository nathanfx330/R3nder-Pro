name: editorial-sidecard-ci

on:
  push:
    branches:
      - editorial-sidecard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Focused editorial SIDECARD tests
        run: >
          flutter test
          test/card_face_painter_parity_test.dart
          test/editorial_card_face_test.dart
          test/presentation_panel_content_test.dart
          test/edit_card_cue_controls_test.dart
          test/edit_sidecard_cue_controls_test.dart
